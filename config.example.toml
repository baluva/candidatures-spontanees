# Configuration des candidatures spontanées (Outlook ou SMTP)

[profile]
first_name = "Prénom"
last_name = "Nom"
email = "prenom.nom@exemple.fr"
phone = "0600000000"
city = "Marseille"
# adresse affichée en haut de la lettre
address = "1 rue Exemple, 13000 Marseille"
cv_path = 'CV.pdf'

[lettres]
# false : chaque lettre PDF est supprimée dès qu'elle a été envoyée (ou jointe au brouillon)
garder = false

[spontane]
# apprendre des réponses reçues : envoyer d'abord aux secteurs / tailles / départements qui répondent,
# y chercher d'abord de nouvelles boîtes (bilan : python apprentissage.py)
apprendre = true
# 13 Bouches-du-Rhône, 83 Var, 84 Vaucluse, 06 Alpes-Maritimes, 30 Gard, 34 Hérault
# ajoute "75", "92" pour Paris / Hauts-de-Seine
departements = ["13", "83", "84", "06", "30", "34"]
# codes NAF : programmation, conseil informatique, services informatiques, traitement de données,
# édition de logiciels, portails web, conseil en gestion, R&D, ingénierie, études de marché
naf = ["62.01Z", "62.02A", "62.03Z", "62.09Z", "63.11Z", "63.12Z", "58.29A", "58.29C",
       "70.22Z", "72.19Z", "71.12B", "73.20Z"]
# tranches INSEE : 11 = 10-19 salariés, 12 = 20-49, 21 = 50-99, 22 = 100-199, 31 = 200-249, 32 = 250-499,
# 41 = 500-999, 42 = 1000-1999, 51 = 2000-4999
# Plus de 1000 salariés retiré le 12/10 : 58 boîtes cherchées, 7 emails, 0 réponse (tout passe par
# leur portail carrière). Les petites structures répondent le plus (20-49 : 5 réponses sur 33).
tranches_effectif = ["11", "12", "21", "22", "31", "32", "41"]
pages_par_recherche = 2

[email]
# "outlook" : envoie depuis Outlook (compte ci-dessous, déjà connecté), "smtp" : serveur SMTP
backend = "outlook"
from = "prenom.nom@exemple.fr"
smtp_host = "smtp.gmail.com"
smtp_port = 465
# (smtp uniquement) mot de passe d'application, jamais écrit ici : variable d'environnement
password_env = "LINKEDIN_APPLY_SMTP_PASSWORD"
max_par_passage = 15
delay_between_sends = [60.0, 180.0]
# python spontane.py relance : une seule relance, au moins ce nombre de jours après l'envoi, sans réponse
relance_apres_jours = 10
relance_body = """Bonjour,

Je me permets de revenir vers vous au sujet de ma candidature spontanée envoyée le {date}, pour une alternance data et IA. Je suis toujours disponible et j'aimerais vraiment en discuter avec vous.

Si vous n'êtes pas la bonne personne, est-ce que vous pourriez transférer ce message à la personne en charge du recrutement ? Merci beaucoup.

Bonne journée,
Prénom Nom
06 00 00 00 00
"""
subject = "Candidature spontanée : alternance data et IA"
body = """Madame, Monsieur,

Je suis en M1 Mastère Expert en IA à Ynov et je cherche une alternance (2 semaines en entreprise, 1 semaine à l'école), disponible tout de suite.

Je me permets de vous écrire directement car le travail de {company} m'intéresse, même sans offre publiée. Vous trouverez en pièces jointes mon CV et ma lettre de motivation. Je viens de terminer un stage de quatre mois chez trITon (application d'analyse vidéo par IA, pipelines de données, tableau de bord qualité). Parmi mes projets, WattCast prévoit la consommation électrique française avec 1,90 % d'erreur contre 1,97 % pour RTE. Tout est sur mon portfolio : baluva.github.io/portfolio

Si une alternance est envisageable chez vous, je serais ravi d'en parler, même brièvement.

Bonne journée,
Prénom Nom
06 00 00 00 00
"""
